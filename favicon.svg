<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Worldtick">
  <!-- The secondary mark: the () glyph alone. Drawn as two arcs rather than
       set as type, so it needs no font and stays crisp at 16x16. -->
  <rect width="32" height="32" rx="7" fill="#0C1116"/>
  <g fill="none" stroke="#4D8BFF" stroke-width="3.4" stroke-linecap="round">
    <path d="M19.4 6.6 Q10.9 16 19.4 25.4"/>
    <path d="M12.6 6.6 Q21.1 16 12.6 25.4"/>
  </g>
</svg>
